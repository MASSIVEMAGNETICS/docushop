<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="#2563eb"/>
  
  <!-- Document icon -->
  <g transform="translate(48, 32)">
    <!-- Document body -->
    <rect x="0" y="20" width="120" height="160" rx="8" fill="white"/>
    
    <!-- Folded corner -->
    <path d="M 120 20 L 120 50 L 90 50 Z" fill="#93c5fd"/>
    <path d="M 90 50 L 120 50 L 120 20" fill="none" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Text lines -->
    <line x1="15" y1="70" x2="105" y2="70" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="90" x2="95" y2="90" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="110" x2="105" y2="110" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="130" x2="85" y2="130" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Signature line -->
    <line x1="15" y1="155" x2="105" y2="155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="60" y="168" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Signature</text>
  </g>
  
  <!-- Plus/edit symbol -->
  <circle cx="200" cy="200" r="28" fill="#10b981"/>
  <line x1="200" y1="186" x2="200" y2="214" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="186" y1="200" x2="214" y2="200" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
