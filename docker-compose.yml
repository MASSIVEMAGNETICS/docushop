version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: docushop-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - docushop-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docushop-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://admin:changeme@mongodb:27017
      DATABASE_NAME: docushop
      SECRET_KEY: change-me-in-production-use-openssl-rand-hex-32
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - docushop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docushop-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - docushop-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local

networks:
  docushop-network:
    driver: bridge
