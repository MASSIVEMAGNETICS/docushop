version: '3.8'

# Production Docker Compose Configuration
# Use this for production deployments with proper security settings

services:
  mongodb:
    image: mongo:7
    container_name: docushop-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"  # Only bind to localhost for security
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ../../deployments/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - docushop-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["--auth"]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/massivemagnetics/docushop/backend:latest}
    container_name: docushop-backend-prod
    restart: always
    environment:
      MONGODB_URL: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${DATABASE_NAME}?authSource=admin
      DATABASE_NAME: ${DATABASE_NAME}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      # S3 Configuration
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # JWT Settings
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "127.0.0.1:8000:8000"  # Only bind to localhost, nginx will proxy
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - docushop-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/massivemagnetics/docushop/frontend:latest}
    container_name: docushop-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docushop-network
    volumes:
      # Mount SSL certificates if using HTTPS
      - ./certs:/etc/nginx/certs:ro
      # Custom nginx config for production
      - ./deployments/docker/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  docushop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
